# CC-A — the CI slice. Runs on every PR and on pushes to the build branch.
#
# This is the substrate the master plan says every phase ships through
# (reconciliation/EALCH-MASTER-BUILD.md, "Cross-cutting workstream CC-A").
# Phases 0 and 1 both shipped before it existed, with their invariants checked
# by hand; from here, the checks below are the machine-enforced versions:
#
#   - tsc --noEmit on both repos (the admin one also proves the cross-repo
#     TS import surface stays resolvable — see the note in
#     ealch-v2/src/content/curriculum.ts for how that breaks)
#   - node --test for the pure islands, which INCLUDES enum-parity.test.ts
#     (the app-union vs Drizzle-pgEnum check with the intentional c2 asymmetry)
#     — do not filter it out of the glob
#   - the Phase 0 honesty gates (no fabricated card number, no price literal
#     outside pricing.ts, no literal SRS ladder in copy)
#   - a byte ceiling on seed.json (the seed is the bounded offline-first
#     subset; the OTA snapshot is where the corpus grows)
#   - content:publish --dry-run against the canonical DB, when the
#     DATABASE_URL secret is configured (see that job's note)
#
# Not covered here (still open in CC-A): expo-updates/release-model, eas.json
# channels + submit config, the toolchain-proof eas build, project identity.

name: ci

on:
  pull_request:
  push:
    branches: [build/ealch-v2-expo]

jobs:
  app:
    name: ealch-v2 · typecheck + tests + honesty gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ealch-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: the test suite runs .ts files through `node --test`
          # directly (type-stripping), which needs a modern runtime. Keep in
          # step with the version developers run locally.
          node-version: 24
          cache: npm
          cache-dependency-path: ealch-v2/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: pure-island tests (includes enum parity)
        run: npm test

      - name: honesty gates (Phase 0 invariants)
        # Each grep must find NOTHING. These are the acceptance criteria from
        # Phase 0 of the master plan, made permanent: a hit means a fabrication
        # is back. Explanatory comments in the codebase are deliberately written
        # WITHOUT these literals so this stays mechanically checkable.
        run: |
          fail=0
          if grep -rn "4212" app src; then
            echo "::error::fabricated card number found (Phase 0 / CF-23)"; fail=1
          fi
          if grep -rn '\$79\|\$9\.99\|6\.58\|£69\|CA\$99\|79 €' app src --include='*.ts' --include='*.tsx' | grep -v 'src/content/pricing.ts'; then
            echo "::error::price literal outside src/content/pricing.ts (Phase 0 price matrix rule)"; fail=1
          fi
          if grep -rn '1 → 3 → 7\|1 -> 3 -> 7' app src; then
            echo "::error::literal SRS ladder in copy (Phase 0 / CF-21)"; fail=1
          fi
          exit $fail

      - name: seed.json byte ceiling
        # The seed is the bounded offline-first subset committed to git; corpus
        # growth belongs to the OTA snapshot, not this file. If this trips
        # legitimately, the answer is a smaller seed-cut in
        # ealch-admin/scripts/seed-cut.config.ts, not a bigger ceiling —
        # raising it needs a deliberate decision recorded here.
        #
        # Raised 256 KiB → 5 MiB (Paul, 2026-07-31): the 256 KiB figure was
        # calibrated when the seed was 20 KB, before the sons full-rig lessons
        # (sons.01-04, each 40-70 KB of JSON body) and Speak World 1's offline
        # bundle (825 referenced items) existed. Even the bare-minimum seed
        # (lessons + World 1, zero theme vocab) now measures ~524 KiB, already
        # over the old ceiling. Today's full seed-cut (17 themes, all levels,
        # per seed-cut.config.ts) measures ~2.4 MiB; 5 MiB leaves headroom
        # without a seed-cut.config.ts change. If the seed keeps growing,
        # trim seed-cut.config.ts (e.g. level-cap the theme sweep to
        # sons/a1/a2, or per-theme item caps) before raising this again.
        #
        # Raised 5 MiB → 16 MiB (Paul, 2026-09-05). The trim was considered
        # first, as the note above asks, and it does not reach. Measured on the
        # v62 seed:
        #
        #   lessons  a1   31   3.45 MiB      items  10417   4.95 MiB
        #            a2   37   3.87 MiB
        #          sons   10   0.90 MiB      file, pretty-printed  14.13 MiB
        #
        # Dropping A2 entirely lands near 10 MiB and minifying the file lands at
        # 9.24 MiB; doing both only just clears 5 MiB, and each costs something
        # real. A partial track is the one thing seed-cut.config.ts argues
        # against by name — the Den renders each unit at its true spine seq, so
        # a subset drew a curriculum numbered 1, 2, 3, 9, 10, 16, 19, which
        # reads as broken rather than as incomplete. Minifying would cut the
        # diff reviewability the seed is deliberately pretty-printed for.
        #
        # What actually changed is the denominator. The old figure was set when
        # the spine was seven A1 units; it is now 75 units and 78 lessons, all
        # three Den tracks complete, and the config bundles whole tracks on
        # purpose. 16 MiB is roughly 1.1x today's file: enough that a lesson or
        # two does not trip it, tight enough that a fourth track cannot land
        # here unnoticed. A B1 track is the next thing that would exceed it, and
        # it should — that is a seed-cut decision, not a ceiling one.
        run: |
          node -e '
            const max = 16 * 1024 * 1024;
            const size = require("fs").statSync("src/content/seed.json").size;
            console.log(`seed.json: ${size} bytes (ceiling ${max})`);
            if (size > max) { console.error("seed.json exceeds the documented ceiling"); process.exit(1); }
          '

  admin:
    name: ealch-admin · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ealch-admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from ealch-admin/package.json "packageManager" —
        # pnpm-workspace.yaml here is a v10+ CONFIG file (allowBuilds) with no
        # packages field, which older pnpm majors reject as a broken workspace.
        with:
          package_json_file: ealch-admin/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ealch-admin/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: typecheck (includes the cross-repo import surface)
        # This job type-checks every ealch-v2 file the admin imports
        # (schema.ts, progress-schema.ts, curriculum.ts → progress.logic.ts),
        # so it is the gate that catches an app-side change breaking the
        # publish pipeline's one canonical TS contract.
        run: pnpm run typecheck

  publish-dry-run:
    name: content:publish --dry-run (needs DATABASE_URL secret)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ealch-admin
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: check for secret
        id: gate
        # The dry run refuses to invent a database: publish-content.ts dies
        # without DATABASE_URL by design (it must read the canonical DB, never
        # PGlite). Until the repo secret is configured this job succeeds with a
        # notice instead of failing every PR — but the master plan's intent is
        # that it becomes a REQUIRED status check once the secret exists.
        # Configure it: repo Settings → Secrets and variables → Actions →
        # DATABASE_URL (read access to the canonical Postgres is enough).
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not configured — dry-run skipped. Set it to arm this gate."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          package_json_file: ealch-admin/package.json

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ealch-admin/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        # The Phase 2.D deterministic French gates (gates/check_french.py et
        # al., master build doc §2.D) run over subprocess python, spawned by
        # publish-content.ts via `process.env.PYTHON_BIN || 'python'`. Without
        # this step the runner has no guaranteed `python` on PATH and the dry
        # run dies with "No module named 'verbecc'" before it ever reaches the
        # gate logic — see gates/requirements.txt for why verbecc (not
        # mlconjug3) is pinned.
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: install French gate dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r gates/requirements.txt

      - name: content:publish --dry-run
        if: steps.gate.outputs.run == 'true'
        run: pnpm run content:publish -- --dry-run
